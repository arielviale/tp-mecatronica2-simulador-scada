<rect x="0" y="0" width="1100" height="500" fill="#ffffff"/><text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="start" font-weight="bold" fill="#1a1a1a" font-style="normal">Diagrama en bloques del sistema</text><text x="40" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#666666" font-style="italic">Información: pulsadores y sensores → lógica → bobinas.  Energía: 220 V AC → potencia.</text><rect x="40" y="110" width="190" height="72" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2" rx="6"/><text x="135" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-style="normal">Alimentación</text><text x="135" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666" font-style="normal">220 V AC</text><rect x="40" y="250" width="210" height="160" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="6"/><text x="145" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-style="normal">ENTRADAS</text><text x="58" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#333333" font-style="normal">S0  emergencia (NC)</text><text x="58" y="321" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#333333" font-style="normal">S1  marcha (NA)</text><text x="58" y="338" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#333333" font-style="normal">S2  paro (NC)</text><text x="58" y="355" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#333333" font-style="normal">SA1  selector</text><text x="58" y="372" font-family="Arial, Helvetica, sans-serif" font-size="