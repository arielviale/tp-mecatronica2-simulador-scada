="middle" font-weight="normal" fill="#333333" font-style="normal">H1  bomba en marcha</text><text x="785" y="363" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333" font-style="normal">H2  válvula abierta</text><rect x="980" y="250" width="90" height="160" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2" rx="6"/><text x="1025" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-style="normal">PLANTA</text><text x="1025" y="306" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#333333" font-style="normal">Tanque</text><text x="1025" y="325" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#333333" font-style="normal">Bomba</text><text x="1025" y="344" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#333333" font-style="normal">Válvula</text><line x1="250" y1="330" x2="345" y2="330" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="297" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666" font-style="normal">señales</text><line x1="580" y1="330" x2="675" y2="330" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="627" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666" font-style="normal">órdenes</text><line x1="890" y1="330" x2="975" y2="330" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="932" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666" font-style="normal">potencia</text><line x1="230" y1="146" x2="465" y2="146" stroke="#1a1a1a" stroke-width="2"/><line x1="465" y1="146" x2="465" y2="